<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width,initial-scale=1.0'>
<title>Alux's Drop-In Hub</title>
<link rel='preconnect' href='https://fonts.googleapis.com'>
<link rel='preconnect' href='https://fonts.gstatic.com' crossorigin>
<link href='https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800&display=swap' rel='stylesheet'>
<style>
:root{--bg:#0a0a0a;--card:#141414;--line:#1e1e1e;--orange:#FF6B00;--muted:#888888;--text:#F5F5F5;--danger:#ff3b3b;--ymca:#FF6B00;--aaniin:#00C9A7;--cornell:#4B8EF1;--shadow:0 8px 32px rgba(255,107,0,.12);--r:16px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;padding-bottom:112px}button,input,select{font:inherit}button{cursor:pointer}.app{width:min(1180px,calc(100% - 32px));margin:auto;padding:24px 0 48px}.topbar{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;min-height:78px;margin:-24px 0 22px;padding:20px 0 14px;background:rgba(10,10,10,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}h1,h2,h3{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;letter-spacing:0}.brand{margin:0;color:var(--orange);font-size:clamp(2.2rem,6vw,4.4rem);line-height:.9;white-space:nowrap}.date{justify-self:center;font-size:.82rem;font-weight:800;letter-spacing:.12em;text-align:center;text-transform:uppercase}.lock{justify-self:end;display:grid;place-items:center;width:44px;height:44px;border:1px solid #2b2b2b;border-radius:999px;background:var(--card);color:var(--text);transition:.2s}.lock:hover,.lock:focus-visible{border-color:var(--orange);color:var(--orange);box-shadow:var(--shadow);transform:translateY(-2px);outline:0}.lock svg{width:19px;height:19px}.admin-banner{display:none;justify-content:center;align-items:center;min-height:42px;margin-bottom:18px;border:1px solid rgba(255,107,0,.55);border-radius:var(--r);background:rgba(255,107,0,.12);color:var(--orange);font-weight:900;letter-spacing:.18em;text-transform:uppercase}.admin .admin-banner{display:flex;animation:lift .36s ease both}.filters{display:flex;gap:10px;overflow-x:auto;padding:2px 0 8px;margin-bottom:32px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.pill{flex:0 0 auto;min-height:42px;padding:0 18px;border:1px solid #2b2b2b;border-radius:999px;background:var(--card);color:var(--muted);font-size:.84rem;font-weight:800;transition:.2s}.pill:hover{border-color:var(--orange);color:var(--text);transform:translateY(-1px)}.pill.active{border-color:var(--orange);background:var(--orange);color:var(--text);box-shadow:0 8px 28px rgba(255,107,0,.18)}.section{margin-top:34px}.head{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:16px}.title{margin:0;font-size:clamp(2.2rem,6vw,4rem);line-height:.9}.meta{margin:0 0 4px;color:var(--muted);font-size:.85rem;font-weight:700;text-align:right;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{display:flex;min-height:184px;flex-direction:column;justify-content:space-between;gap:18px;padding:20px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);opacity:0;transform:translateY(14px);animation:cardin .38s ease forwards;transition:opacity .2s,transform .2s,border-color .2s,box-shadow .2s}.card:hover{border-color:rgba(255,107,0,.54);box-shadow:var(--shadow);transform:translateY(-4px)}.card.fade{opacity:0;transform:translateY(10px)}.card-top,.card-bottom{display:flex;justify-content:space-between;gap:16px}.card-top{align-items:flex-start}.card-bottom{align-items:flex-end}.activity{margin:0;font-size:clamp(2rem,5vw,3rem);line-height:.9}.loc{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--muted);font-size:.92rem;font-weight:700}.dot{width:10px;height:10px;border-radius:999px;flex:0 0 10px}.tag{min-width:72px;padding:8px 10px;border-radius:999px;color:#0a0a0a;font-size:.72rem;font-weight:900;text-align:center;text-transform:uppercase}.time{font-size:1.12rem;font-weight:900;line-height:1.1}.notes{margin-top:6px;color:var(--muted);font-size:.84rem;font-weight:600}.book,.primary,.secondary,.danger{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 16px;border-radius:999px;border:1px solid transparent;font-size:.82rem;font-weight:900;text-transform:uppercase;text-decoration:none;transition:.2s}.book{background:var(--text);color:#090909}.book:hover,.primary:hover{background:var(--orange);color:var(--text);box-shadow:var(--shadow);transform:translateY(-2px)}.empty{display:grid;place-items:center;min-height:142px;padding:26px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--muted);font-weight:800;text-align:center}.week{display:grid;gap:22px}.day{border-left:3px solid transparent;animation:lift .36s ease both}.day.today{padding-left:14px;border-left-color:rgba(255,107,0,.62)}.day-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}.day-name{margin:0;font-size:2.05rem;line-height:1}.day-date{color:var(--muted);font-size:.82rem;font-weight:800;text-transform:uppercase}.quick{position:fixed;left:50%;bottom:18px;z-index:30;display:grid;width:min(720px,calc(100% - 28px));grid-template-columns:repeat(3,1fr);gap:10px;padding:10px;border:1px solid var(--line);border-radius:22px;background:rgba(20,20,20,.94);box-shadow:0 16px 42px rgba(0,0,0,.34);transform:translateX(-50%);backdrop-filter:blur(16px)}.quick a{display:flex;align-items:center;justify-content:center;min-height:46px;border:1px solid #2b2b2b;border-radius:999px;background:var(--bg);color:var(--text);font-size:.82rem;font-weight:900;text-align:center;text-decoration:none;text-transform:uppercase;transition:.2s}.quick a:hover{border-color:var(--orange);color:var(--orange);box-shadow:var(--shadow);transform:translateY(-2px)}.modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.72)}.modal.open{display:flex}.modal-card,.admin-panel{border:1px solid #2b2b2b;border-radius:var(--r);background:var(--card);box-shadow:0 22px 70px rgba(0,0,0,.52);animation:lift .24s ease both}.modal-card{width:min(420px,100%);padding:28px}.modal-title{margin:0 0 8px;color:var(--orange);font-size:2.6rem;line-height:.95}.modal-copy{margin:0 0 18px;color:var(--muted);font-weight:600}.passrow{display:grid;gap:12px}.field{width:100%;min-height:46px;padding:0 14px;border:1px solid #2b2b2b;border-radius:12px;background:var(--bg);color:var(--text);font-weight:700;outline:0}.field:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,107,0,.15)}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary{background:var(--orange);color:var(--text)}.secondary{background:#101010;border-color:#2b2b2b;color:var(--text)}.secondary:hover{border-color:var(--orange);color:var(--orange);transform:translateY(-2px)}.danger{background:rgba(255,59,59,.1);border-color:rgba(255,59,59,.42);color:#ff6b6b}.danger:hover{border-color:var(--danger);color:#fff;transform:translateY(-2px)}.admin-panel{display:none;margin-top:38px;padding:22px}.admin .admin-panel{display:block}.admin-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}.admin-title{margin:0;font-size:3rem;line-height:.95}.admin-tools{display:flex;flex-wrap:wrap;gap:10px}.form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding-bottom:22px;border-bottom:1px solid var(--line)}label{display:grid;gap:8px;color:var(--muted);font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.span-all{display:flex;align-items:end}.span-all .primary{width:100%;min-height:46px}.rows{display:grid;gap:10px;margin-top:20px}.row{display:grid;grid-template-columns:1.1fr 1.1fr .8fr auto;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}.row strong{display:block;margin-bottom:4px}.row span{color:var(--muted);font-size:.82rem;font-weight:700}.shake{animation:shake .36s ease}@keyframes cardin{to{opacity:1;transform:translateY(0)}}@keyframes lift{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}@media (max-width:900px){.topbar{grid-template-columns:1fr auto;row-gap:10px}.date{grid-column:1/-1;grid-row:2;justify-self:start}.grid{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr 1fr}}@media (max-width:640px){body{padding-bottom:194px}.app{width:calc(100% - 22px);padding-top:18px}.topbar{margin-top:-18px}.brand{white-space:normal}.head,.admin-head{align-items:flex-start;flex-direction:column}.meta{text-align:left}.grid,.form,.row,.modal-actions,.quick{grid-template-columns:1fr}.quick{border-radius:var(--r)}.card{min-height:174px}.admin-panel{padding:16px}}@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class='app'>
<nav class='topbar'><h1 class='brand'>ALUX'S DROP-IN HUB</h1><div class='date' id='todayDate'>LOADING</div><button class='lock' id='lockButton' aria-label='Unlock admin mode'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor'><rect x='5' y='11' width='14' height='10' rx='2'></rect><path d='M8 11V8a4 4 0 0 1 8 0v3'></path></svg></button></nav>
<div class='admin-banner'>ADMIN</div>
<div class='filters' id='filters'></div>
<section class='section'><div class='head'><h2 class='title'>TODAY</h2><p class='meta' id='todayCount'>0 sessions</p></div><div id='todaySessions'></div></section>
<section class='section'><div class='head'><h2 class='title'>THIS WEEK</h2><p class='meta' id='weekCount'>0 sessions</p></div><div class='week' id='weekSessions'></div></section>
<section class='admin-panel' id='adminPanel'><div class='admin-head'><h2 class='admin-title'>SCHEDULE MANAGER</h2><div class='admin-tools'><button class='secondary' id='logoutButton'>Logout</button><button class='danger' id='clearButton'>Clear All Data</button></div></div><form class='form' id='sessionForm'><label>Location<select class='field' id='location' required><option>Markham YMCA</option><option>Aaniin Community Centre</option><option>Cornell Community Centre</option></select></label><label>Activity<select class='field' id='activity' required><option>Open Gym</option><option>Basketball</option><option>Drop-in Volleyball</option><option>Open Lane Swim</option><option>Drop-in Badminton</option><option>Study Room</option><option>Teen Programs</option></select></label><label>Day<select class='field' id='day' required><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option></select></label><label>Start time<input class='field' id='startTime' type='time' required></label><label>End time<input class='field' id='endTime' type='time' required></label><label>Notes<input class='field' id='notes' type='text' placeholder='members only'></label><div class='span-all'><button class='primary' type='submit'>Add Session</button></div></form><div class='rows' id='adminList'></div></section>
</main>
<aside class='quick'><a href='https://www.ymcagta.org/find-a-y/markham-ymca' target='_blank' rel='noopener'>Markham YMCA</a><a href='https://cityofmarkham.perfectmind.com/Clients/BookMe4?widgetId=6825ea71-e5b7-4c2a-948f-9195507ad90a' target='_blank' rel='noopener'>Aaniin Centre</a><a href='https://cityofmarkham.perfectmind.com/Clients/BookMe4?widgetId=6825ea71-e5b7-4c2a-948f-9195507ad90a' target='_blank' rel='noopener'>Cornell Centre</a></aside>
<div class='modal' id='passwordModal' aria-hidden='true'><div class='modal-card'><h2 class='modal-title'>ADMIN ACCESS</h2><p class='modal-copy'>Enter the dashboard password to edit drop-in sessions.</p><div class='passrow' id='passwordRow'><input class='field' id='passwordInput' type='password' placeholder='Password'><div class='modal-actions'><button class='primary' id='passwordSubmit'>Unlock</button><button class='secondary' id='passwordCancel'>Cancel</button></div></div></div></div>
<script>
const K='aluxDropInSchedule',PW='jwn44ff3',YMCA='https://www.ymcagta.org/find-a-y/markham-ymca',MARKHAM='https://cityofmarkham.perfectmind.com/Clients/BookMe4?widgetId=6825ea71-e5b7-4c2a-948f-9195507ad90a';
const days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'],filters=['All','Basketball','Open Gym','Volleyball','Swim','Badminton','Study Room','Teen Programs'],acts=['Open Gym','Basketball','Drop-in Volleyball','Open Lane Swim','Drop-in Badminton','Study Room','Teen Programs'];
const seed=[['Markham YMCA','Basketball','Monday','18:00','20:00','Members only'],['Markham YMCA','Open Gym','Wednesday','17:00','19:00',''],['Markham YMCA','Open Lane Swim','Saturday','10:00','12:00',''],['Markham YMCA','Teen Programs','Friday','15:00','17:00',''],['Aaniin Community Centre','Drop-in Volleyball','Tuesday','19:00','21:00',''],['Aaniin Community Centre','Drop-in Badminton','Thursday','18:30','20:30',''],['Aaniin Community Centre','Open Gym','Saturday','09:00','11:00',''],['Aaniin Community Centre','Teen Programs','Friday','16:00','18:00',''],['Cornell Community Centre','Basketball','Saturday','13:00','15:00',''],['Cornell Community Centre','Study Room','Monday','15:00','20:00','Walk-in only'],['Cornell Community Centre','Open Gym','Sunday','11:00','13:00',''],['Cornell Community Centre','Drop-in Volleyball','Wednesday','18:00','20:00','']].map(x=>({id:id(),location:x[0],activity:x[1],day:x[2],start:x[3],end:x[4],notes:x[5]}));
let schedule=[],active='All',admin=false;const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s),esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
function id(){return Date.now()+'-'+Math.random().toString(16).slice(2)}function norm(e){return{id:e.id||id(),location:e.location,activity:e.activity,day:e.day,start:e.start||e.startTime,end:e.end||e.endTime,notes:e.notes||''}}function ok(e){return days.includes(e.day)&&acts.includes(e.activity)}function save(){localStorage.setItem(K,JSON.stringify(schedule))}function load(){try{const raw=localStorage.getItem(K);schedule=raw?JSON.parse(raw).map(norm).filter(ok):seed;save()}catch{schedule=seed;save()}}
function today(){return days[(new Date().getDay()+6)%7]}function weekDate(d){const n=new Date(),i=(n.getDay()+6)%7,m=new Date(n);m.setHours(12,0,0,0);m.setDate(n.getDate()-i+days.indexOf(d));return m}function fmtDate(d){return new Intl.DateTimeFormat('en-CA',{month:'short',day:'numeric'}).format(weekDate(d)).toUpperCase()}function fmtTime(t){const [h,m]=t.split(':').map(Number),d=new Date();d.setHours(h,m,0,0);return new Intl.DateTimeFormat('en-CA',{hour:'numeric',minute:'2-digit'}).format(d).toUpperCase()}function showAct(a){return a=='Drop-in Volleyball'?'Volleyball':a=='Open Lane Swim'?'Lane Swim':a=='Drop-in Badminton'?'Badminton':a}function loc(l){return l.includes('YMCA')?['YMCA','var(--ymca)',YMCA]:l.includes('Aaniin')?['AANIIN','var(--aaniin)',MARKHAM]:['CORNELL','var(--cornell)',MARKHAM]}function match(e){return active=='All'||active==e.activity||active=='Volleyball'&&e.activity=='Drop-in Volleyball'||active=='Swim'&&e.activity=='Open Lane Swim'||active=='Badminton'&&e.activity=='Drop-in Badminton'}function sort(a){return [...a].sort((x,y)=>days.indexOf(x.day)-days.indexOf(y.day)||x.start.localeCompare(y.start))}
function card(e,i){const l=loc(e.location),note=e.notes?`<div class='notes'>${esc(e.notes)}</div>`:'';return `<article class='card' style='animation-delay:${i*50}ms'><div class='card-top'><div><h3 class='activity'>${esc(showAct(e.activity))}</h3><div class='loc'><span class='dot' style='background:${l[1]}'></span><span>${esc(e.location)}</span></div></div><span class='tag' style='background:${l[1]}'>${l[0]}</span></div><div class='card-bottom'><div><div class='time'>${fmtTime(e.start)} - ${fmtTime(e.end)}</div>${note}</div><a class='book' href='${l[2]}' target='_blank' rel='noopener'>Book Now</a></div></article>`}
function renderFilters(){$('#filters').innerHTML=filters.map(f=>`<button class='pill ${f==active?'active':''}' data-f='${f}'>${f}</button>`).join('');$$('.pill').forEach(b=>b.onclick=()=>{active=b.dataset.f;$$('.card').forEach(c=>c.classList.add('fade'));setTimeout(render,170)})}function render(){renderFilters();const t=today(),items=sort(schedule.filter(ok).filter(match)),tod=items.filter(e=>e.day==t);$('#todayCount').textContent=`${tod.length} ${tod.length==1?'session':'sessions'}`;$('#weekCount').textContent=`${items.length} ${items.length==1?'session':'sessions'}`;$('#todaySessions').innerHTML=tod.length?`<div class='grid'>${tod.map(card).join('')}</div>`:`<div class='empty'>No sessions today &mdash; check the week below</div>`;$('#weekSessions').innerHTML=days.map(d=>{const xs=items.filter(e=>e.day==d);return xs.length?`<section class='day ${d==t?'today':''}'><div class='day-head'><h3 class='day-name'>${d}</h3><span class='day-date'>${fmtDate(d)}</span></div><div class='grid'>${xs.map(card).join('')}</div></section>`:''}).join('')||`<div class='empty'>No sessions match this filter.</div>`;renderAdmin()}
function renderAdmin(){if(!admin)return;$('#adminList').innerHTML=sort(schedule).map(e=>`<div class='row'><div><strong>${esc(e.activity)}</strong><span>${esc(e.location)}</span></div><div><strong>${esc(e.day)}</strong><span>${fmtTime(e.start)} - ${fmtTime(e.end)}</span></div><div><strong>Notes</strong><span>${e.notes?esc(e.notes):'None'}</span></div><button class='danger' data-del='${e.id}'>Delete</button></div>`).join('')||`<div class='empty'>No schedule data yet.</div>`;$$('[data-del]').forEach(b=>b.onclick=()=>{schedule=schedule.filter(e=>e.id!=b.dataset.del);save();render()})}
function openModal(){$('#passwordModal').classList.add('open');$('#passwordModal').setAttribute('aria-hidden','false');$('#passwordInput').value='';setTimeout(()=>$('#passwordInput').focus(),50)}function closeModal(){$('#passwordModal').classList.remove('open');$('#passwordModal').setAttribute('aria-hidden','true')}function unlock(){if($('#passwordInput').value==PW){admin=true;document.body.classList.add('admin');closeModal();render();$('#adminPanel').scrollIntoView({behavior:'smooth'});return}const r=$('#passwordRow');r.classList.remove('shake');void r.offsetWidth;r.classList.add('shake');$('#passwordInput').select()}
$('#lockButton').onclick=openModal;$('#passwordCancel').onclick=closeModal;$('#passwordSubmit').onclick=unlock;$('#passwordInput').onkeydown=e=>{if(e.key=='Enter')unlock();if(e.key=='Escape')closeModal()};$('#passwordModal').onclick=e=>{if(e.target.id=='passwordModal')closeModal()};$('#logoutButton').onclick=()=>{admin=false;document.body.classList.remove('admin');render();scrollTo({top:0,behavior:'smooth'})};$('#clearButton').onclick=()=>{if(confirm('Clear all saved schedule data? This cannot be undone.')){schedule=[];save();render()}};$('#sessionForm').onsubmit=e=>{e.preventDefault();schedule.push(norm({location:$('#location').value,activity:$('#activity').value,day:$('#day').value,start:$('#startTime').value,end:$('#endTime').value,notes:$('#notes').value.trim()}));save();e.target.reset();render()};
const now=new Date(),wd=new Intl.DateTimeFormat('en-CA',{weekday:'long'}).format(now).toUpperCase(),dt=new Intl.DateTimeFormat('en-CA',{month:'long',day:'numeric',year:'numeric'}).format(now).toUpperCase();$('#todayDate').textContent=wd+' '+String.fromCharCode(8212)+' '+dt;load();render();
</script>
</body>
</html>
